    <script>
      try { var t = localStorage.getItem('mt.theme'); if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); var f = localStorage.getItem('mt.fontScale'); if (f) document.documentElement.style.fontSize = f; } catch (e) {}
    </script>
